name: Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar arquivos do projeto
        run: |
          test -f settings.gradle || (echo "ERRO: settings.gradle não está na raiz do repositório." && exit 1)
          test -f build.gradle || (echo "ERRO: build.gradle não está na raiz do repositório." && exit 1)
          test -f app/build.gradle || (echo "ERRO: app/build.gradle não foi encontrado. Envie a pasta app para a raiz." && exit 1)
          test -f app/src/main/AndroidManifest.xml || (echo "ERRO: AndroidManifest.xml não encontrado." && exit 1)
          test -f app/src/main/assets/index.html || (echo "ERRO: index.html não encontrado em app/src/main/assets/." && exit 1)

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MeuLauncherTV-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
