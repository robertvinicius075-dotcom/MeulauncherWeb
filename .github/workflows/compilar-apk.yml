name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Montar as pastas do projeto
        run: |
          D=proj/app/src/main
          mkdir -p $D/java/com/meulauncher/tv $D/assets $D/res/values $D/res/drawable
          cp AndroidManifest.xml $D/
          cp HomeActivity.java $D/java/com/meulauncher/tv/
          cp index.html $D/assets/
          cp strings.xml styles.xml $D/res/values/
          cp banner.xml ic_launcher.xml $D/res/drawable/
          cat > proj/settings.gradle <<'FIM'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MeuLauncher"
          include ':app'
          FIM
          cat > proj/build.gradle <<'FIM'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          FIM
          echo "android.nonTransitiveRClass=true" > proj/gradle.properties
          cat > proj/app/build.gradle <<'FIM'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.meulauncher.tv'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.meulauncher.tv'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          FIM
          find proj -type f

      - name: Preparar Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MeuLauncherTV-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
